<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling Tool</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo-icon">📅</div>
    <h1>Scheduling Tool</h1>
    <span>Manage appointments, bookings, and availability</span>
  </header>

  <!-- Auth view -->
  <main id="auth-view" class="auth-container" hidden>
    <section class="auth-card">
      <h2 id="auth-title">Sign In</h2>
      <form id="auth-form">
        <label id="name-label" for="auth-name" hidden>Name</label>
        <input type="text" id="auth-name" placeholder="Your name" hidden />
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required />
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="At least 8 characters" required />
        <button type="submit" id="auth-submit" class="btn-primary">Sign In</button>
      </form>
      <p id="auth-status" class="auth-status" hidden></p>
      <p class="switch">
        <button type="button" id="auth-toggle" class="link-button">Create an account</button>
      </p>
    </section>
  </main>

  <!-- App view -->
  <div id="app-view" hidden>
    <div class="app-toolbar">
      <div class="toolbar-left">
        <button type="button" class="btn-secondary" onclick="shiftWeek(-1)">◀ Prev</button>
        <button type="button" class="btn-secondary" onclick="goToToday()">Today</button>
        <button type="button" class="btn-secondary" onclick="shiftWeek(1)">Next ▶</button>
        <span class="week-label" id="weekLabel"></span>
      </div>
      <div class="toolbar-right">
        <button type="button" class="btn-secondary" onclick="exportJSON()">📥 Export JSON</button>
        <button type="button" class="btn-secondary" onclick="document.getElementById('importJSONInput').click()">📤 Import JSON</button>
        <input type="file" id="importJSONInput" accept=".json" style="display:none" onchange="importJSON(event)">
        <button type="button" class="btn-secondary" onclick="exportCSV()">📊 Export CSV</button>
        <button type="button" class="btn-secondary" onclick="openAvailability()">🕒 Availability</button>
        <button type="button" class="btn-secondary" onclick="openReminders()">🔔 Reminders</button>
        <button type="button" id="logout-button" class="btn-secondary">Sign out</button>
      </div>
    </div>

    <div class="schedule-wrap">
      <!-- Client Tracker integration -->
      <div class="ct-bar">
        <span class="ct-title">🔗 Client Tracker</span>
        <input type="text" id="ctUrl" placeholder="http://localhost:3000" class="ct-input">
        <input type="password" id="ctToken" placeholder="API token" class="ct-input">
        <button type="button" class="btn-secondary" onclick="fetchClientsFromTracker()">Fetch Clients</button>
        <select id="ctClientSelect" onchange="applyTrackerClient()">
          <option value="">— Select a client —</option>
        </select>
        <span class="ct-title">🧾 Invoice URL</span>
        <input type="text" id="invoiceUrl" placeholder="http://localhost:3002" class="ct-input">
      </div>

      <!-- Week grid -->
      <div class="week-grid" id="weekGrid"></div>
    </div>
  </div>

  <!-- Booking / edit dialog -->
  <dialog id="appt-dialog">
    <form id="appt-form">
      <h2 id="appt-form-title">Book Appointment</h2>
      <label for="appt-client">Client Name *</label>
      <input type="text" id="appt-client" required />
      <div class="form-row">
        <div class="form-group">
          <label for="appt-email">Email</label>
          <input type="email" id="appt-email" />
        </div>
        <div class="form-group">
          <label for="appt-phone">Phone</label>
          <input type="tel" id="appt-phone" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="appt-date">Date</label>
          <input type="date" id="appt-date" required />
        </div>
        <div class="form-group">
          <label for="appt-time">Time</label>
          <input type="time" id="appt-time" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="appt-duration">Duration (minutes)</label>
          <select id="appt-duration">
            <option value="30">30 min</option>
            <option value="60" selected>60 min</option>
            <option value="90">90 min</option>
            <option value="120">120 min</option>
          </select>
        </div>
        <div class="form-group">
          <label for="appt-status">Status</label>
          <select id="appt-status">
            <option value="scheduled">Scheduled</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div id="appt-repeat-section">
        <div class="form-row">
          <div class="form-group">
            <label for="appt-repeat">Repeat</label>
            <select id="appt-repeat">
              <option value="">Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div class="form-group">
            <label for="appt-repeat-interval">Every</label>
            <div class="interval-wrap">
              <input type="number" id="appt-repeat-interval" min="1" max="52" value="1" />
              <span id="appt-repeat-unit">week(s)</span>
            </div>
          </div>
        </div>
        <div class="form-group" id="appt-repeat-days" hidden>
          <label>Repeat on</label>
          <div class="day-checkboxes" id="appt-repeat-days-box">
            <label class="day-check"><input type="checkbox" value="1" /> Mon</label>
            <label class="day-check"><input type="checkbox" value="2" /> Tue</label>
            <label class="day-check"><input type="checkbox" value="3" /> Wed</label>
            <label class="day-check"><input type="checkbox" value="4" /> Thu</label>
            <label class="day-check"><input type="checkbox" value="5" /> Fri</label>
            <label class="day-check"><input type="checkbox" value="6" /> Sat</label>
            <label class="day-check"><input type="checkbox" value="7" /> Sun</label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="appt-repeat-end">End date (optional)</label>
            <input type="date" id="appt-repeat-end" />
          </div>
          <div class="form-group">
            <label for="appt-reminder">Email reminder</label>
            <select id="appt-reminder">
              <option value="">None</option>
              <option value="60">1 hour before</option>
              <option value="1440">1 day before</option>
              <option value="2880">2 days before</option>
              <option value="10080">1 week before</option>
            </select>
          </div>
        </div>
      </div>
      <label for="appt-notes">Notes</label>
      <textarea id="appt-notes" rows="3"></textarea>
      <p id="appt-series-note" class="series-note" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="appt-delete" class="btn-danger" hidden>Delete</button>
        <button type="button" id="appt-edit-series" class="btn-secondary" hidden>Edit entire series</button>
        <button type="button" id="appt-proposal" class="btn-secondary" hidden>📄 Open Proposal</button>
        <button type="button" id="appt-invoice" class="btn-secondary" hidden>🧾 Create Invoice</button>
        <button type="button" id="appt-view-invoice" class="btn-secondary" hidden>🧾 View Invoice</button>
        <span class="spacer"></span>
        <button type="button" id="appt-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" id="appt-save" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Availability dialog -->
  <dialog id="avail-dialog">
    <form id="avail-form">
      <h2>Availability Windows</h2>
      <p class="dialog-hint">Days without a window are closed. Uncheck every day to be fully open (8:00–18:00).</p>
      <div id="avail-rows"></div>
      <div class="dialog-actions">
        <button type="button" id="avail-cancel" class="btn-secondary">Cancel</button>
        <span class="spacer"></span>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Reminders dialog -->
  <dialog id="reminders-dialog">
    <div>
      <h2>Email Reminders</h2>
      <p class="dialog-hint" id="reminders-mode"></p>
      <div id="reminders-list" class="reminders-list"></div>
      <div class="dialog-actions">
        <button type="button" id="reminders-test" class="btn-secondary">Send test email</button>
        <span class="spacer"></span>
        <button type="button" id="reminders-close" class="btn-primary">Close</button>
      </div>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
